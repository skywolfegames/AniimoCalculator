<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aniimo — Consulta de Interações Elementais</title>
<style>
  :root {
    --bg:#edf0fb; --panel:#fbfbfe; --ink:#252b43; --muted:#747b98;
    --line:#e1e4f0; --purple:#d95bfa; --purple-bg:#fff4ff;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:linear-gradient(135deg,#e8ecf9,#f5f6fc);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
  .wrap{max-width:1150px;margin:auto}
  .panel{background:rgba(255,255,255,.95);border:1px solid #fff;border-radius:22px;box-shadow:0 12px 35px #343b6414;padding:28px}
  .top{margin-bottom:20px}
  h1{font-size:clamp(20px,3vw,26px);margin:0 0 6px;font-weight:800;letter-spacing:-.6px}
  .sub{font-size:13px;color:var(--muted)}

  .config-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;background:#f4f6fc;padding:12px 16px;border-radius:12px}
  .config-bar label{font-size:13px;font-weight:800;color:var(--ink)}
  .config-bar select{width:80px;padding:8px;border-radius:8px;border:1px solid #dfe1ed;font-weight:700;background:#fff}

  .dual-layout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;align-items:start}
  
  .frame-box{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,0.04)}
  .frame-box h2{font-size:15px;margin:0 0 16px;font-weight:800;border-bottom:2px solid var(--line);padding-bottom:8px}

  .slot-row{margin-bottom:12px}
  .slot-row label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:4px;text-transform:uppercase}
  select.team-select{width:100%;padding:11px 12px;border:1px solid #dfe1ed;border-radius:10px;background:#f9f9fd;color:var(--ink);font-size:13px;font-weight:700;outline:none}
  select.team-select:focus{border-color:#d96df2;box-shadow:0 0 0 3px #f8e6ff}

  .result-slot{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f2f8;min-height:56px}
  .result-slot:last-child{border-bottom:none}
  .cross-mark{font-size:18px;font-weight:900;color:#e63946;width:24px;text-align:center}
  .result-content{font-size:13px;font-weight:700;color:var(--ink);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  
  .badge{font-size:11px;font-weight:700;padding:5px 9px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fcfdff}
  .badge.counter{background:var(--purple-bg);color:#a52ab7;border-color:#efc2fa}

  .element-icon{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:white;font-size:11px;font-weight:900;border:1.5px solid rgba(0,0,0,0.2)}
  .ice{background:#38b6ff}
  .water{background:#0077b6}
  .electric{background:#ffb703}
  .fire{background:#d90429}
  .nature{background:#38b000}
  .earth{background:#b5838d}
  .wind{background:#4ea8de}
  .dark{background:#7209b7}
  .light{background:#ffb703}

  .foot{font-size:11px;color:#9298af;margin-top:20px;line-height:1.5;text-align:center}
  @media(max-width:768px){.dual-layout{grid-template-columns:1fr}}
  @media(min-width:769px) and (max-width:1024px){.dual-layout{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <main class="panel">
    <div class="top">
      <h1>Aniimo — Consulta de Interações Elementais</h1>
      <div class="sub">Selecione um elemento para ver em quais outros ele tem vantagem.</div>
    </div>

    <div class="config-bar">
      <label for="opponent-count">Quantidade de Elementos:</label>
      <select id="opponent-count">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </div>

    <div class="dual-layout">
      <div class="frame-box">
        <h2>Selecione os Elementos</h2>
        <div id="selectors-container"></div>
      </div>

      <div class="frame-box">
        <h2>Se quero defender</h2>
        <div id="results-container"></div>
      </div>

      <div class="frame-box">
        <h2>Se quero atacar</h2>
        <div id="counters-container"></div>
      </div>
    </div>

    <div class="foot">Sincronizado rigorosamente com a matriz oficial do jogo.</div>
  </main>
</div>

<script>
// Ordem: 0:Gelo, 1:Água, 2:Raio, 3:Fogo, 4:Planta, 5:Terra, 6:Vento, 7:Dark, 8:Luz
const elements = [
  {id:'ice', name:'Gelo', icon:'❄', cls:'ice'},
  {id:'water', name:'Água', icon:'💧', cls:'water'},
  {id:'electric', name:'Raio', icon:'⚡', cls:'electric'},
  {id:'fire', name:'Fogo', icon:'🔥', cls:'fire'},
  {id:'nature', name:'Planta', icon:'🌿', cls:'nature'},
  {id:'earth', name:'Terra', icon:'⛰', cls:'earth'},
  {id:'wind', name:'Vento', icon:'🌀', cls:'wind'},
  {id:'dark', name:'Dark', icon:'👁', cls:'dark'},
  {id:'light', name:'Luz', icon:'☀️', cls:'light'}
];

// Matriz atualizada:
// Linha = Atacante, Coluna = Defensor. 1 = Atacante tem vantagem.
const interactionMatrix = [
  // Gelo, Água, Raio, Fogo, Planta, Terra, Vento, Dark, Luz
  [ 0,    1,    0,    0,    0,     0,     0,     0,     1 ], // Gelo (bate em Água e Luz)
  [ 0,    0,    0,    1,    0,     1,     0,     0,     0 ], // Água (bate em Fogo e Terra)
  [ 0,    1,    0,    0,    0,     0,     1,     0,     0 ], // Raio (bate em Água e Vento)
  [ 1,    0,    0,    0,    1,     0,     0,     0,     0 ], // Fogo (bate em Gelo e Planta)
  [ 0,    1,    0,    0,    0,     1,     0,     0,     0 ], // Planta (bate em Água e Terra)
  [ 1,    0,    0,    1,    0,     0,     0,     0,     0 ], // Terra (bate em Gelo e Fogo)
  [ 0,    0,    0,    0,    1,     0,     0,     1,     0 ], // Vento (bate em Planta e Dark)
  [ 0,    0,    1,    0,    1,     0,     0,     0,     1 ], // Dark (bate em Raio, Planta e Luz)
  [ 0,    0,    0,    0,    0,     0,     1,     1,     0 ]  // Luz (bate em Vento e Dark)
];

const countSelect = document.getElementById('opponent-count');
const selectorsContainer = document.getElementById('selectors-container');
const resultsContainer = document.getElementById('results-container');
const countersContainer = document.getElementById('counters-container');

const icon = e => `<span class="element-icon ${e.cls}">${e.icon}</span>`;

function initUI() {
  const count = parseInt(countSelect.value);
  let selectorsHtml = '';

  for (let i = 0; i < count; i++) {
    selectorsHtml += `
      <div class="slot-row">
        <label>Slot 0${i+1}</label>
        <select class="team-select" data-index="${i}">
          <option value="none">— Nenhum / Vazio —</option>
    `;
    elements.forEach((e, idx) => {
      const selected = (i === 0 && idx === 1) || (i === 1 && idx === 1) || (i === 2 && idx === 1) ? 'selected' : '';
      selectorsHtml += `<option value="${idx}" ${selected}>${e.name}</option>`;
    });
    selectorsHtml += `</select></div>`;
  }

  selectorsContainer.innerHTML = selectorsHtml;
  document.querySelectorAll('.team-select').forEach(sel => {
    sel.addEventListener('change', updateResults);
  });

  updateResults();
}

function updateResults() {
  const selects = document.querySelectorAll('.team-select');
  let resultsHtml = '';
  let countersHtml = '';

  selects.forEach((sel) => {
    const val = sel.value;
    
    // Frame de vantagens
    resultsHtml += `
      <div class="result-slot">
        <div class="cross-mark">→</div>
        <div class="result-content">
    `;

    // Frame de counters
    countersHtml += `
      <div class="result-slot">
        <div class="cross-mark">⚠️</div>
        <div class="result-content">
    `;

    if (val === 'none') {
      resultsHtml += `<span style="color:var(--muted);font-weight:normal;font-size:12px;">Slot vazio</span>`;
      countersHtml += `<span style="color:var(--muted);font-weight:normal;font-size:12px;">Slot vazio</span>`;
    } else {
      const attackerIdx = parseInt(val);
      const attackerElement = elements[attackerIdx];

      // Calcular vantagens do elemento selecionado
      let advantages = [];
      const attackerRow = interactionMatrix[attackerIdx];
      attackerRow.forEach((value, defenderIdx) => {
        if (value === 1) {
          advantages.push(elements[defenderIdx]);
        }
      });

      resultsHtml += `<span class="badge" style="border-color:#b9c5ff">${icon(attackerElement)} ${attackerElement.name}:</span>`;

      if (advantages.length > 0) {
        advantages.forEach(c => {
          resultsHtml += `<span class="badge counter">${icon(c)} ${c.name}</span>`;
        });
      } else {
        resultsHtml += `<span style="color:var(--muted);font-weight:normal;font-size:12px;">Nenhuma vantagem direta</span>`;
      }

      // Calcular counters (quem é efetivo contra o elemento selecionado)
      let counters = [];
      interactionMatrix.forEach((row, rowIdx) => {
        if (row[attackerIdx] === 1) {
          counters.push(elements[rowIdx]);
        }
      });

      countersHtml += `<span class="badge" style="border-color:#b9c5ff">${icon(attackerElement)} ${attackerElement.name}:</span>`;

      if (counters.length > 0) {
        counters.forEach(c => {
          countersHtml += `<span class="badge counter" style="background:#ffe6e6;color:#c62828;border-color:#ffcdd2">${icon(c)} ${c.name}</span>`;
        });
      } else {
        countersHtml += `<span style="color:var(--muted);font-weight:normal;font-size:12px;">Nenhum counter direto</span>`;
      }
    }

    resultsHtml += `</div></div>`;
    countersHtml += `</div></div>`;
  });

  resultsContainer.innerHTML = resultsHtml;
  countersContainer.innerHTML = countersHtml;
}

countSelect.addEventListener('change', initUI);
initUI();
</script>
</body>
</html>
